<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Client Reply Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="container">
        <h1>Client Reply Monitor</h1>
        <p>Check the employee Gmail inbox for a new client reply.</p>
        <section class="status-card" aria-live="polite">
            <p class="subtitle">Monitoring status</p>
            <p id="monitoringStatus" class="connected">● Stopped</p>
            <p id="status">Ready.</p>
            <p id="monitoringTimer">Current time: 00:00:00</p>
            <button id="startMonitoring" type="button">Start monitoring</button>
            <button id="stopMonitoring" type="button">Stop monitoring</button>
        </section>
        <section id="replyBox" class="reply-box" hidden></section>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
